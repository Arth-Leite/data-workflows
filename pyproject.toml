[tool.uv.workspace]
members = ["apps/*"]
exclude = ["apps/terraform-gke-project"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.1",
    "beautifulsoup4>=4.15.0",
    "playwright>=1.64.1",
    "pre-commit>=4.6.0",
    "redis>=8.0.1",
    "tenacity>=9.1.4",
]

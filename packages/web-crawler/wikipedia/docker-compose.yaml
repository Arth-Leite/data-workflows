services:
  crawler:
    build:
      context: ../../../
      dockerfile: packages/web-crawler/wikipedia/Dockerfile
    volumes:
      - ./crawled_data:/app/crawled_data
    environment:
      OUTPUT_DIR: /app/crawled_data
      REDIS_HOST: redis
    command: python -m web_crawler.wikipedia.crawler
    depends_on:
      - redis
  redis:
    image: redis:8-alpine
    container_name: crawler_redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
  postgres:
    image: postgres:18-alpine
    container_name: crawler_postgres

volumes:
  redis-data:

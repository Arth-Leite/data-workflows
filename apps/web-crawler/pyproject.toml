[project]
name = "web-crawler"
version = "0.1.0"
description = "Web crawling and scraping tools"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=10.0.1",
    "aiohttp>=3.14.1",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "debugpy>=1.8.0",
    "monkeytype>=23.3.0",
    "playwright>=1.60.0",
    "redis>=8.0.1",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

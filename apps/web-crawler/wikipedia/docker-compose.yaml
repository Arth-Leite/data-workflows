x-db-env: &db-env
  POSTGRES_USER: postgres
  POSTGRES_DB: crawler
  POSTGRES_PASSWORD: 1234

services:
  crawler:
    container_name: wikipedia_crawler
    build:
      context: ../../../
      dockerfile: apps/web-crawler/wikipedia/Dockerfile
    ports:
      - "5678:5678"
    environment:
      <<: *db-env
      OUTPUT_DIR: /app/crawled_data
      REDIS_HOST: redis
      POSTGRES_HOST: postgres # postgres service name, not localhost
      RABBITMQ_HOST: rabbitmq
      PYTHONUNBUFFERED: "1"
      MT_DB_PATH: /app/monkeytype-data/monkeytype.sqlite3
    volumes:
      - ../src/web_crawler:/app/apps/web-crawler/src/web_crawler
      - ../monkeytype-data:/app/monkeytype-data
    command: sh -c "uv sync --frozen --no-dev --package web-crawler && python -m web_crawler.wikipedia"
    # command: sh -c "uv sync --frozen --no-dev --package web-crawler && monkeytype run -m web_crawler.wikipedia"
    # command: sh -c "uv sync --frozen --no-dev --package web-crawler && python -m debugpy --listen 0.0.0.0:5678 --wait-for-client -m web_crawler.wikipedia.crawler"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  redis:
    container_name: crawler_redis
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: redis-cli ping
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 20s

  postgres:
    container_name: crawler_postgres
    image: postgres:18-alpine
    environment:
      <<: *db-env
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 20s

  rabbitmq:
    container_name: crawler_rabbitmq
    image: rabbitmq:4.3.5-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - "5672:5672"
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 20s

volumes:
  redis-data:
  db-data:
  rabbit-data:

x-db-env: &db-env
  POSTGRES_USER: postgres
  POSTGRES_DB: crawler
  POSTGRES_PASSWORD: 1234

services:
  crawler:
    container_name: wikipedia_crawler
    build:
      context: ../../../
      dockerfile: apps/web-crawler/wikipedia/Dockerfile
    ports:
      - "5678:5678"
    environment:
      <<: *db-env
      OUTPUT_DIR: /app/crawled_data
      POSTGRES_HOST: postgres # postgres service name, not localhost
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../src:/app/apps/web-crawler/src
    command: python -m web_crawler.wikipedia
    # command: python -m debugpy --listen 0.0.0.0:5678 --wait-for-client -m web_crawler.wikipedia
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  postgres:
    container_name: crawler_postgres
    image: postgres:18-alpine
    environment:
      <<: *db-env
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 20s


volumes:
  db-data:

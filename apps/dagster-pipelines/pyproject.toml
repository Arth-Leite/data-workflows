[project]
name = "dagster-pipelines"
version = "0.1.0"
description = "Dagster pipeline definitions"
requires-python = ">=3.10,<3.15"
dependencies = [
    "dagster==1.13.10",
    "duckdb>=1.5.4",
    "faker>=40.23.0",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "dagster_pipelines"
registry_modules = [
    "dagster_pipelines.components.*",
]



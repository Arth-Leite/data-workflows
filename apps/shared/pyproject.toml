[project]
name = "data-workflows"
version = "0.1.0"
description = "Shared utilities for data workflow orchestration"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.3",
    "faker>=40.21.0",
    "tenacity>=9.1.4",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

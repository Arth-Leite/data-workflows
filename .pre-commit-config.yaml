repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        files: docker-compose.*\.ya?ml$

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.2.2
    hooks:
      - id: sqlfluff-lint
        files: \.sql$
      - id: sqlfluff-fix
        files: \.sql$

  - repo: local
    hooks:
      - id: hadolint
        name: hadolint
        description: Lint Dockerfiles (requires `brew install hadolint`)
        entry: hadolint
        language: system
        files: Dockerfile

  - repo: local
    hooks:
      - id: docker-compose-validate
        name: docker compose config validation
        entry: bash -c 'for f in "$@"; do docker compose -f "$f" config -q || exit 1; done' --
        language: system
        files: docker-compose.*\.ya?ml$
        pass_filenames: true
